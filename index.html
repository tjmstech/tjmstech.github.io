<title>전체게임</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f5f7;color:#16181d;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.cnt{font-size:14px;font-weight:700;color:#8b8f99}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
@media (max-width:540px){.grid{grid-template-columns:1fr 1fr;gap:12px}body{padding-left:12px;padding-right:12px}}
.card{display:block;background:#fff;text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,box-shadow .2s}
.thumb{position:relative;aspect-ratio:3/2;overflow:hidden;background:#dfe2e8}
.art{transition:transform .35s}
.info{position:relative;padding:16px 18px 44px;min-height:110px}
.name{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.meta{margin-top:6px;font-size:12.5px;color:#8b8f99;font-weight:500}
.meta b{color:#1d6cf0;font-weight:700;margin-right:5px}
.dev{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;color:#b8bcc6}
.dev svg{width:20px;height:20px}
@media (hover:hover){.card:hover{box-shadow:0 10px 24px rgba(20,24,35,.12);transform:translateY(-3px)}.card:hover .art{transform:scale(1.05)}}
.card:active .art{transform:scale(1.03)}
@media (max-width:540px){.info{padding:12px 12px 36px;min-height:92px}.name{font-size:15px}.meta{font-size:11.5px}.dev{right:10px;bottom:9px}.dev svg{width:17px;height:17px}}
.soon .thumb{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#eceef2 0 14px,#e4e7ec 14px 28px)}
.soon .thumb span{font-size:13px;font-weight:700;letter-spacing:.2em;color:#a3a8b3}
.soon .name{color:#a3a8b3}
.soon{pointer-events:none}

.thumb{container-type:inline-size}
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.ov{position:absolute;left:5.5cqw;top:5cqw}
.cowlogo{font-family:"Jua",sans-serif;font-weight:400;font-size:15cqw;line-height:1.05;color:#ffd21f;letter-spacing:.03em;text-shadow:0.0682em 0.0000em 0 #7a3400,0.0636em 0.0250em 0 #7a3400,0.0477em 0.0477em 0 #7a3400,0.0250em 0.0636em 0 #7a3400,0.0000em 0.0682em 0 #7a3400,-0.0250em 0.0636em 0 #7a3400,-0.0477em 0.0477em 0 #7a3400,-0.0636em 0.0250em 0 #7a3400,-0.0682em 0.0000em 0 #7a3400,-0.0636em -0.0250em 0 #7a3400,-0.0477em -0.0477em 0 #7a3400,-0.0250em -0.0636em 0 #7a3400,-0.0000em -0.0682em 0 #7a3400,0.0250em -0.0636em 0 #7a3400,0.0477em -0.0477em 0 #7a3400,0.0636em -0.0250em 0 #7a3400,0.0682em 0.0909em 0 #7a3400,0.0636em 0.1159em 0 #7a3400,0.0477em 0.1386em 0 #7a3400,0.0250em 0.1545em 0 #7a3400,0.0000em 0.1591em 0 #7a3400,-0.0250em 0.1545em 0 #7a3400,-0.0477em 0.1386em 0 #7a3400,-0.0636em 0.1159em 0 #7a3400,-0.0682em 0.0909em 0 #7a3400,-0.0636em 0.0659em 0 #7a3400,-0.0477em 0.0432em 0 #7a3400,-0.0250em 0.0273em 0 #7a3400,-0.0000em 0.0227em 0 #7a3400,0.0250em 0.0273em 0 #7a3400,0.0477em 0.0432em 0 #7a3400,0.0636em 0.0659em 0 #7a3400}
.cowtag{display:inline-block;margin-top:2.6cqw;font-weight:900;font-size:3.6cqw;color:#fff;background:#e8402f;border:.55cqw solid #fff;border-radius:999px;padding:.5cqw 2.6cqw;box-shadow:0 .6cqw 0 #a81818}
.vologo{font-weight:900;font-size:10.6cqw;line-height:1.08;color:#fff;letter-spacing:-.01em;text-shadow:0 .9cqw 0 #0b0f24,0 0 4cqw rgba(142,91,255,.8)}
.vologo span{display:block;color:#c39bff}
.votag{display:inline-block;margin-top:2.8cqw;font-weight:900;font-size:3.3cqw;color:#0c0f24;background:#5fe08a;border-radius:999px;padding:.7cqw 2.6cqw}
